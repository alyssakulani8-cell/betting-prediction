services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: betting
      POSTGRES_PASSWORD: betting_secret
      POSTGRES_DB: betting_prediction
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betting -d betting_prediction"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-api:
    build:
      context: .
      dockerfile: Dockerfile.ml
    ports:
      - "8000:8000"
    environment:
      ML_API_HOST: "0.0.0.0"
      ML_API_PORT: "8000"
      MODEL_PATH: "models/"
      DATA_PATH: "data/"
      CACHE_PATH: "data/cache/"
      REGISTRY_PATH: "models/registry/"
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      BASKETBALL_API_KEY: ${BASKETBALL_API_KEY:-}
    volumes:
      - ml_data:/app/data
      - ml_models:/app/models
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      NODE_ENV: "production"
      DATABASE_URL: "postgresql://betting:betting_secret@postgres:5432/betting_prediction"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      REDIS_URL: "redis://redis:6379"
      ML_API_URL: "http://ml-api:8000"
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  ml_data:
  ml_models:
